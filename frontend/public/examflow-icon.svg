<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#1a56db"/>

  <!-- Pencil body -->
  <rect x="27" y="10" width="11" height="26" rx="3" fill="white" transform="rotate(12 27 10)"/>

  <!-- Pencil tip -->
  <polygon points="24,42 34,40 29,52" fill="#fbbf24"/>

  <!-- Pencil eraser cap -->
  <rect x="27" y="9" width="11" height="5" rx="2.5" fill="#93c5fd" transform="rotate(12 27 9)"/>

  <!-- Answer lines (left side) -->
  <line x1="10" y1="44" x2="20" y2="44" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="51" x2="20" y2="51" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Answer lines (right side) -->
  <line x1="43" y1="51" x2="54" y2="51" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
